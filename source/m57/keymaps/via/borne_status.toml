# borne_status lighting rules.
#
# TWO layers of config, both lowered to C by scripts/borne_status_gen.py:
#
#   1. [[keyrule]] - keycode-driven AUTOCOLORING. each frame, every LED is
#      colored by the class of the *live vial keycode* bound under it on the
#      active layer (transparency resolved through the layer stack). this is
#      independent of which physical key / layer - rearrange keys in vial and
#      the colors follow. declared order = match priority (first match wins).
#
#   2. [[override]] - per-layer LED overlays for cues that CANNOT be derived
#      from a keycode (e.g. "you are on layer N via this trigger key", the
#      layer-7 typing finger map, host num/caps lock state). same schema as the
#      old [[rule]] blocks. applied AFTER autocoloring, so they win.
#
# precedence per frame (last writer wins):
#   breathing-white background -> autocolor ([[keyrule]]) -> [[override]] (by priority)
#
# to recolor a class, reorder priority, or toggle a rule: edit this file and
# rerun scripts/borne_status_gen.py. only adding a brand-new matcher/effect
# primitive needs a python change (MATCH_C_EXPR / EFFECT_EMIT in the generator).

[meta]
priority_higher_wins = true
breath = "sin8"            # sin8(scale16by8(g_rgb_timer, speed/8)) then abs8(s-128)*2, scaled by hsv.v

# ---------------------------------------------------------------------
# named colors (RGB triples).
# ---------------------------------------------------------------------
[colors]
white   = [255, 255, 255]
yellow  = [255, 255,   0]
green   = [  0, 255,   0]
blue    = [  0,   0, 255]
red     = [255,   0,   0]
pink    = [255,   0, 255]    # active-layer indicator (overrides)
magenta = [255,   0, 255]    # macros (autocolor) - same hue as pink, different role
cyan    = [  0, 255, 255]    # media keys
grey    = [ 85,  85,  85]    # 0x55 grey, RGB-mode-key placeholder + "Meta" cell

# ---------------------------------------------------------------------
# animation parameters for the RGB-control-key effects. tunable here.
# ---------------------------------------------------------------------
[anim]
rainbow_shift = 4            # hue = (g_rgb_timer >> shift) & 0xFF   (~4s / full cycle)
saw_shift     = 3            # value sawtooth phase = (g_rgb_timer >> shift) & 0xFF  (~2s)
pulse_fast    = 4            # speed/4  -> faster than base breath (speed/8)
pulse_slow    = 16           # speed/16 -> slower than base breath
mode_color    = "grey"       # color for RGB mode-cycle keys (placeholder, undecided)

# ---------------------------------------------------------------------
# modifier color blend (chart-encoded). used by the `mod_blend` effect for
# mod-TAP keys (e.g. LGUI_T(KC_A)): computed every frame from held mods.
#   without gui: base 0x00 / high 0xAA ;  with gui: base 0x55 / high 0xFF
#   r = shift?high:base ; g = ctrl?high:base ; b = alt?high:base
# no mods held -> RGB(0,0,0) (dark). plain modifier keycodes instead use the
# static per-mod `mod_static` effect (shift=red ctrl=green alt=blue gui=white).
# ---------------------------------------------------------------------
[mod_blend]
shift_channel = "r"
ctrl_channel  = "g"
alt_channel   = "b"
gui_effect    = "intensity"

# =====================================================================
# AUTOCOLOR rules - ordered keycode-class -> effect. first match wins.
# `match` names a matcher the generator knows; `effect` is a color name
# (pulsating) or a named effect (red_static / mod_static / mod_blend /
# rainbow_fwd / rainbow_rev / saw_up / saw_down / pulse_fast / pulse_slow /
# mode). unmatched keys keep the breathing-white background.
# =====================================================================

[[keyrule]]                  # bootloader + reboot + clear-eeprom + debug-toggle
match  = "system_danger"
effect = "red_static"

[[keyrule]]                  # MO/TO/LT/TG/TT/DF/OSL/LM + layer-lock
match  = "layer_switch"
effect = "yellow"

[[keyrule]]                  # LGUI_T(KC_A) etc - dynamic held-mod blend
match  = "mod_tap"
effect = "mod_blend"

[[keyrule]]                  # plain KC_LCTL..KC_RGUI - static per-mod color
match  = "modifier"
effect = "mod_static"

[[keyrule]]
match  = "rgb_hue_up"
effect = "rainbow_fwd"

[[keyrule]]
match  = "rgb_hue_down"
effect = "rainbow_rev"

[[keyrule]]                  # value down: ramp dark then jump to max
match  = "rgb_val_down"
effect = "saw_down"

[[keyrule]]                  # value up: ramp bright then drop (inverse)
match  = "rgb_val_up"
effect = "saw_up"

[[keyrule]]                  # effect- : pulse slower than base breath
match  = "rgb_speed_down"
effect = "pulse_slow"

[[keyrule]]                  # effect+ : pulse faster than base breath
match  = "rgb_speed_up"
effect = "pulse_fast"

[[keyrule]]                  # mode cycle next/prev - placeholder color
match  = "rgb_mode"
effect = "mode"

[[keyrule]]                  # mouse cursor move
match  = "mouse_cursor"
effect = "yellow"

[[keyrule]]                  # mouse buttons (L/R/M/...)
match  = "mouse_button"
effect = "blue"

[[keyrule]]                  # mouse wheel
match  = "mouse_wheel"
effect = "green"

[[keyrule]]                  # numpad digits 0-9
match  = "numpad_digit"
effect = "green"

[[keyrule]]                  # numpad operators (/ * - + enter . = ,)
match  = "numpad_op"
effect = "blue"

[[keyrule]]                  # media transport + volume + mute
match  = "media"
effect = "cyan"

[[keyrule]]                  # vial macros M0..M31
match  = "macro"
effect = "magenta"

[[keyrule]]                  # F1-F12
match  = "fkeys"
effect = "yellow"

[[keyrule]]                  # arrow cluster
match  = "arrows"
effect = "yellow"

# =====================================================================
# OVERRIDES - per-layer cues not derivable from keycodes. emitted after
# autocolor; sorted by priority (higher wins). LED indices are absolute
# (0..57) per m57.c g_led_config.
# =====================================================================

# --- active-layer trigger highlight: the trigger key you held to get here
#     flips from its autocolor yellow to pink ("yes, you're on layer N").
[[override]]
id        = "l1_active_trigger"
priority  = 2
layers    = [1]
leds      = [27]              # MO(1)  matrix (4,4)
color     = "pink"
pulsating = true

[[override]]
id        = "l2_active_trigger"
priority  = 2
layers    = [2]
leds      = [13]              # LT2(TAB)  matrix (2,0)
color     = "pink"
pulsating = true

[[override]]
id        = "l3_active_trigger"
priority  = 2
layers    = [3]
leds      = [56]              # MO(3)  matrix (9,2)
color     = "pink"
pulsating = true

[[override]]
id        = "l4_active_triggers"
priority  = 2
layers    = [4]
leds      = [27, 57]          # MO(1) + MO(4)
color     = "pink"
pulsating = true

# --- layer 7 typing finger-position map (alpha keys, not keycode-derivable).
[[override]]
id        = "l7_finger_hint_green"
priority  = 2
layers    = [7]
leds      = [6]               # left "Tab" home  matrix (1,0)
color     = "green"
pulsating = true

[[override]]
id        = "l7_finger_hint_yellow"
priority  = 2
layers    = [7]
leds      = [
    7,  8,  9,  10,           # QWER       matrix (1,1..4)
    14, 15, 16, 17,           # ASDF       matrix (2,1..4)
    27, 28,                   # inner thumbs (4,4..5)
    37, 38, 39, 40,           # UIOP mirror (6,2..5)
    44, 45, 46, 47,           # JKL; mirror (7,2..5)
    55, 56,                   # inner thumbs mirror (9,1..2)
]
color     = "yellow"
pulsating = true

# --- gaming layers 5/6 navigation cues (the bound keycodes there are alphas /
#     KC_TAB, so autocolor leaves them background; these mark the way out).
[[override]]
id        = "l5_l6_back_indicator"
priority  = 2
layers    = [5, 6]
leds      = [48]              # back-to-base position  matrix (7,6)
color     = "pink"
pulsating = true

[[override]]
id        = "l5_tab_indicator"
priority  = 2
layers    = [5]
leds      = [13]              # LT2(TAB) via fall-through  matrix (2,0)
color     = "yellow"
pulsating = true

[[override]]
id        = "l6_tab_indicator"
priority  = 2
layers    = [6]
leds      = [13]              # KC_TAB  matrix (2,0)
color     = "pink"
pulsating = true

# --- yellow position hints for the Tab/quote trigger keys (KC_TAB / KC_QUOTE
#     aren't classified by autocolor, so hint where re-entry / exit lives).
[[override]]
id        = "l2_trigger_hints"
priority  = 2
layers    = [2]
leds      = [48]             # ' / back-to-base position  matrix (7,6)
color     = "yellow"
pulsating = true

[[override]]
id        = "l1_l3_trigger_hints"
priority  = 2
layers    = [1, 3]
leds      = [
    13,                       # LT2(Tab)  matrix (2,0)
    48,                       # ' / back-to-base  matrix (7,6)
]
color     = "yellow"
pulsating = true

# --- layer 2: cyan base on the num/caps lock positions, so they read as
#     "lock keys here" (cyan) and flip to green when the host lock is on
#     (the priority-3 gated rules below win). priority 2 = below the green.
[[override]]
id        = "l2_lock_base"
priority  = 2
layers    = [2]
leds      = [35, 42]         # num + caps lock positions  matrix (6,0)/(7,0)
color     = "cyan"
pulsating = true

# --- host num/caps lock state (green when the OS lock is on). top priority.
#     scroll lock omitted - linux/wayland never reports it back to the board.
[[override]]
id        = "num_lock"
priority  = 3
layers    = [0, 1, 2]
leds      = [35]              # KC_NUM_LOCK position  matrix (6,0)
color     = "green"
pulsating = true
gate      = "num_lock_on"

[[override]]
id        = "caps_lock"
priority  = 3
layers    = [0, 1, 2]
leds      = [42]              # KC_CAPS_LOCK position  matrix (7,0)
color     = "green"
pulsating = true
gate      = "caps_lock_on"
